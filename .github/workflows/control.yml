name: Go control service

on:
  push:
    branches: [main, port/control-service]
  # The ci:full label is read on the PR's next push. Label changes don't start
  # a run: they would share the PR's concurrency group and cancel its run.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new commit replaces the same PR's older run. Every main run keeps its own
# group, so each main commit is tested in full.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('control-pr-{0}', github.event.pull_request.number) || format('control-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Picks the jobs a pull request needs from its changed files
  # (.github/ci/changes.mjs); pushes, manual runs, stacked PRs and the ci:full
  # label get every group. A gated job runs unless this job succeeded and
  # answered false for its group, so a failure here costs runner time, never
  # coverage. .github/ci/gates.test.mjs checks every gate below.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Every group, so this job is the same in each workflow that has one.
    outputs:
      node: ${{ steps.filter.outputs.node }}
      helper: ${{ steps.filter.outputs.helper }}
      installer: ${{ steps.filter.outputs.installer }}
      legacy_windows: ${{ steps.filter.outputs.legacy_windows }}
      testisp: ${{ steps.filter.outputs.testisp }}
      wintun: ${{ steps.filter.outputs.wintun }}
      go_windows: ${{ steps.filter.outputs.go_windows }}
      go_linux: ${{ steps.filter.outputs.go_linux }}
      acceptance: ${{ steps.filter.outputs.acceptance }}
      control: ${{ steps.filter.outputs.control }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge base and its file list need the whole history.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test the classifier, its map against test readers, and the job gates
        run: node --test .github/ci/*.test.mjs
      - name: Choose jobs from the changed files
        id: filter
        run: node .github/ci/changes.mjs

  windows:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.control != 'false') }}
    name: Control / Windows ${{ matrix.arch }} / ${{ matrix.control }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        runner: [windows-latest, windows-11-arm]
        control: [node, go]
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -mod=vendor -p=2
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      # The first powershell.exe start on windows-11-arm can take 22-28 s,
      # longer than the 20 s deadline inside the shipped readers the parity
      # suite compares against. Start it once here, outside every test
      # deadline, so parity and the later routing steps do not pay it.
      - name: Warm up Windows PowerShell 5.1
        run: |
          $powershell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $started = Get-Date
          & $powershell -NoProfile -NonInteractive -Command 'exit 0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $elapsed = ((Get-Date) - $started).TotalSeconds
          "Windows PowerShell 5.1 started in $([math]::Round($elapsed, 1)) s"
      # Compile-only until retirement step 2(b) deletes these tagged sources.
      # No installed native test executes either compatibility binary.
      - name: Compile historical launcher pending physical deletion
        if: matrix.control == 'node'
        run: |
          go build -tags control_compat -o bin/historical-control.exe ./cmd/netswitch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -tags control_compat,control_test_https -o bin/historical-https.exe ./cmd/netswitch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installed native candidates
        if: matrix.control == 'go'
        run: |
          $directory = Join-Path $env:ProgramFiles 'NetSwitch-Installed-Harness-CI'
          go build -tags lifecycle_test -ldflags "-X github.com/AyoubAchour/net-switch/internal/buildinfo.Version=${{ github.sha }}-installed" -o "$directory/netswitch.exe" ./cmd/netswitch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -tags lifecycle_test -ldflags "-X github.com/AyoubAchour/net-switch/internal/buildinfo.Version=${{ github.sha }}-installed" -o "$directory/netswitch-engine.exe" ./cmd/netswitch-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -tags lifecycle_test -ldflags "-X github.com/AyoubAchour/net-switch/internal/buildinfo.Version=${{ github.sha }}-installed" -o "$directory/netswitch-desktop.exe" ./cmd/netswitch-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -tags lifecycle_test -ldflags "-X github.com/AyoubAchour/net-switch/internal/buildinfo.Version=${{ github.sha }}-installed" -o "$directory/netswitchctl.exe" ./cmd/netswitchctl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -c -o "$directory/lifecycle.test.exe" ./tests/lifecycle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -c -o "$directory/worker.test.exe" ./internal/platform/worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o "$directory/testisp.exe" ./tests/windows/testisp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/windows/testisp/fetch-wintun.ps1 -Directory $directory
          icacls $directory /setowner '*S-1-5-32-544' /T /Q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Win32 parity
        id: parity
        if: matrix.control == 'go'
        continue-on-error: true
        run: node scripts/win32-parity.mjs (Join-Path $env:ProgramFiles 'NetSwitch-Installed-Harness-CI/netswitch.exe') --installed-startup-suite
      - name: Fetch verified sing-box
        if: matrix.control == 'node'
        run: ./scripts/fetch-engine.ps1
      - name: Build the two-path TUN harness and fetch its signed driver
        if: matrix.control == 'node'
        run: |
          go build -o dist/windows-test/testisp.exe ./tests/windows/testisp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o dist/windows-test/testisp-probe.exe ./tests/windows/testisp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/windows/testisp/fetch-wintun.ps1 -Directory dist/windows-test
      - name: Routing against the selected control executable
        if: matrix.control == 'node'
        run: |
          $server = (Get-Command node).Source
          node scripts/e2e-routing.mjs --server-executable $server --public-via-tun
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: TUN against the selected control executable
        if: matrix.control == 'node'
        run: |
          $server = (Get-Command node).Source
          node scripts/e2e-tun.mjs --server-executable $server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installed startup and quarantine
        id: startup
        if: matrix.control == 'go'
        continue-on-error: true
        env:
          NETSWITCH_LIFECYCLE_CI: '1'
          NETSWITCH_NATIVE_CI: '1'
          NETSWITCH_NATIVE_FAULTS: '1'
          NETSWITCH_LIFECYCLE_FILTER: '^TestInstalledNativeStartup$'
        run: |
          $env:NETSWITCH_LIFECYCLE_DIR = Join-Path $env:ProgramFiles 'NetSwitch-Installed-Harness-CI'
          Push-Location tests/lifecycle
          try {
            node (Join-Path $env:GITHUB_WORKSPACE 'scripts/run-native-proof.mjs') installed-startup (Join-Path $env:NETSWITCH_LIFECYCLE_DIR 'lifecycle.test.exe') run-hosted
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Installed routing and TUN
        id: traffic
        if: matrix.control == 'go'
        continue-on-error: true
        env:
          NETSWITCH_LIFECYCLE_CI: '1'
          NETSWITCH_NATIVE_CI: '1'
          NETSWITCH_NATIVE_FAULTS: '1'
          NETSWITCH_LIFECYCLE_FILTER: '^TestInstalledNativeTraffic$'
        run: |
          $env:NETSWITCH_LIFECYCLE_DIR = Join-Path $env:ProgramFiles 'NetSwitch-Installed-Harness-CI'
          Push-Location tests/lifecycle
          try {
            node (Join-Path $env:GITHUB_WORKSPACE 'scripts/run-native-proof.mjs') installed-traffic (Join-Path $env:NETSWITCH_LIFECYCLE_DIR 'lifecycle.test.exe') run-hosted
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Require all native results to pass
        if: always() && matrix.control == 'go' && (steps.parity.outcome != 'success' || steps.startup.outcome != 'success' || steps.traffic.outcome != 'success')
        run: throw 'Native parity/startup/traffic failed or did not run; complete case results are above.'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: control-${{ matrix.arch }}-${{ matrix.control }}
          path: dist/tun-test/
          retention-days: 7
