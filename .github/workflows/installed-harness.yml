name: Installed native harness

on:
  workflow_dispatch:

permissions:
  contents: read

# This qualification workflow is intentionally two jobs while the migration is
# being proved. Existing required Control gates remain intact until replacement.
jobs:
  windows:
    name: Installed harness / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [windows-latest, windows-11-arm]
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -mod=vendor -p=2
      NETSWITCH_LIFECYCLE_CI: '1'
      NETSWITCH_NATIVE_CI: '1'
      NETSWITCH_NATIVE_FAULTS: '1'
      NETSWITCH_LIFECYCLE_FILTER: '^TestInstalledNativeStartup$'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build installed native candidates
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:ProgramFiles 'NetSwitch-Installed-Harness-CI'
          go build -tags lifecycle_test -ldflags "-X github.com/AyoubAchour/net-switch/internal/buildinfo.Version=${{ github.sha }}-installed" -o "$directory/netswitch.exe" ./cmd/netswitch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -tags lifecycle_test -ldflags "-X github.com/AyoubAchour/net-switch/internal/buildinfo.Version=${{ github.sha }}-installed" -o "$directory/netswitch-engine.exe" ./cmd/netswitch-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -tags lifecycle_test -ldflags "-X github.com/AyoubAchour/net-switch/internal/buildinfo.Version=${{ github.sha }}-installed" -o "$directory/netswitch-desktop.exe" ./cmd/netswitch-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -tags lifecycle_test -ldflags "-X github.com/AyoubAchour/net-switch/internal/buildinfo.Version=${{ github.sha }}-installed" -o "$directory/netswitchctl.exe" ./cmd/netswitchctl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -c -o "$directory/lifecycle.test.exe" ./tests/lifecycle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -c -o "$directory/worker.test.exe" ./internal/platform/worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o "$directory/testisp.exe" ./tests/windows/testisp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/windows/testisp/fetch-wintun.ps1 -Directory $directory
          icacls $directory /setowner '*S-1-5-32-544' /T /Q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Warm up Windows PowerShell 5.1
        run: |
          & (Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe') -NoProfile -NonInteractive -Command 'exit 0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Win32 worker parity
        id: parity
        continue-on-error: true
        run: |
          node scripts/win32-parity.mjs (Join-Path $env:ProgramFiles 'NetSwitch-Installed-Harness-CI/netswitch.exe') --installed-startup-suite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installed startup and quarantine assertions
        id: startup
        continue-on-error: true
        run: |
          $env:NETSWITCH_LIFECYCLE_DIR = Join-Path $env:ProgramFiles 'NetSwitch-Installed-Harness-CI'
          Push-Location tests/lifecycle
          try {
            node (Join-Path $env:GITHUB_WORKSPACE 'scripts/run-native-proof.mjs') installed-startup (Join-Path $env:NETSWITCH_LIFECYCLE_DIR 'lifecycle.test.exe') run-hosted
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Installed native routing and TUN assertions
        id: traffic
        continue-on-error: true
        run: |
          $env:NETSWITCH_LIFECYCLE_DIR = Join-Path $env:ProgramFiles 'NetSwitch-Installed-Harness-CI'
          $env:NETSWITCH_LIFECYCLE_FILTER = '^TestInstalledNativeTraffic$'
          Push-Location tests/lifecycle
          try {
            node (Join-Path $env:GITHUB_WORKSPACE 'scripts/run-native-proof.mjs') installed-traffic (Join-Path $env:NETSWITCH_LIFECYCLE_DIR 'lifecycle.test.exe') run-hosted
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Require all collected results
        if: always() && (steps.startup.outcome != 'success' || steps.traffic.outcome != 'success' || steps.parity.outcome != 'success')
        run: throw 'Installed qualification failed or did not run; see individual parity, startup and traffic results above.'
