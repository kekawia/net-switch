name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Verify 1.0 release gates
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: -mod=vendor -p=2
      NODE_OPTIONS: --max-old-space-size=2048
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check tag and changelog
        id: metadata
        run: node scripts/release-metadata.mjs
      - name: Verify retirement manifest and CI gates
        run: node --test .github/ci/*.test.mjs
      - name: Refuse a release while any declared gate is unfinished
        run: go run ./tests/linux/cmd/nsaccept release-gate
      - name: Require the production offline root public key
        run: go run ./cmd/netswitchctl update-check-root
      - name: Require the scheduled Windows integrity streak
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/m6/night-gate.mjs

  qualification:
    needs: release-gate
    uses: ./.github/workflows/m6.yml
    with:
      version: ${{ needs.release-gate.outputs.version }}

  windows-installers:
    name: Build Windows ${{ matrix.arch }} installer
    needs: release-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cache-pinned-archive
        with:
          artifact: go
      - uses: ./.github/actions/cache-pinned-archive
        with:
          artifact: wintun
      - uses: ./.github/actions/cache-pinned-archive
        with:
          artifact: webview2
      - uses: ./.github/actions/cache-pinned-archive
        with:
          artifact: inno
      - name: Build the pinned production installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release-gate.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: ./scripts/build-windows-installer.ps1 -Arch $env:RELEASE_ARCH -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/NetSwitch-Setup-${{ needs.release-gate.outputs.version }}-${{ matrix.arch }}.exe
          if-no-files-found: error

  linux-packages:
    needs: release-gate
    uses: ./.github/workflows/linux-packages.yml
    with:
      version: ${{ needs.release-gate.outputs.version }}
    secrets:
      NETSWITCH_RPM_KEY: ${{ secrets.NETSWITCH_RPM_KEY }}

  signed-release:
    name: Sign, verify and publish release
    needs: [release-gate, windows-installers, linux-packages, qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: -mod=vendor -p=2
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # Compile before the online signing secret enters the environment.
      - name: Build the verification and signing tool
        run: go build -trimpath -o bin/netswitchctl ./cmd/netswitchctl
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-windows-*
          path: dist/release
          merge-multiple: true
      - name: Sign and independently reverify the release assets
        env:
          NETSWITCH_RELEASE_SIGNING_KEY: ${{ secrets.NETSWITCH_RELEASE_SIGNING_KEY }}
          RELEASE_VERSION: ${{ needs.release-gate.outputs.version }}
        run: node scripts/sign-update-release.mjs --ctl bin/netswitchctl --artifacts dist/release --version "$RELEASE_VERSION"
      - name: Recheck release notes
        run: node scripts/release-metadata.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-packages
          path: dist/linux
      - name: Collect verified Linux packages, signed repository and Arch recipe
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          cp dist/linux/*.{deb,rpm,tar.gz} dist/release/
          tar -C dist/linux/repo -czf "dist/release/netswitch-rpm-repo-$VERSION.tar.gz" .
          tar -C "dist/linux/aur-$VERSION" -czf "dist/release/netswitch-aur-$VERSION.tar.gz" .
      - name: Publish only after every asset verifies
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$RELEASE_VERSION" --draft --verify-tag --title "Net Switch $RELEASE_VERSION" --notes-file dist/release-notes.md dist/release/*
          gh release edit "v$RELEASE_VERSION" --draft=false

  rpm-repository:
    needs: signed-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-packages
          path: dist/linux
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist/linux/repo
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
