name: Linux owner bridge diagnostic
on:
  workflow_call:
permissions:
  contents: read
jobs:
  objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - run: node scripts/generate-owner-bpf.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bridge-objects
          path: dist/ownerbpf/first/*.o
          if-no-files-found: error
  modern:
    needs: objects
    name: bridge-diagnostic / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64, target: x86 }
          - { runner: ubuntu-24.04-arm, arch: arm64, target: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -mod=vendor -p=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: bridge-objects
          path: dist/ownerbpf
      - name: Build and pure contracts
        run: |
          go test -v -count=1 ./internal/engine/linux/ownerbpf
          go test -tags=ownerbpfproof -c -o dist/bridge-proof ./internal/engine/linux/ownerbpf
          go tool objdump -s 'ownerbpf.burstBarrier' dist/bridge-proof
      - name: Isolated kernel diagnostics (not complete P1/P2 qualification)
        run: |
          sudo env GOMAXPROCS=2 NS_OWNERBPF_PROOF=1 NS_BRIDGE_OBJECT="$PWD/dist/ownerbpf/bridge_${{ matrix.target }}_bpfel.o" NS_BRIDGE_FAULT_OBJECT="$PWD/dist/ownerbpf/fault_${{ matrix.target }}_bpfel.o" unshare --net -- dist/bridge-proof -test.v -test.timeout=90s -test.run='^TestBridge'
